name: Suricata CI

on:
  push:
    paths: ['suricata/**', '*.md', 'Dockerfile', '.dockerignore', '.gcloudignore', 'pyproject.toml', 'ruff.toml', 'deploy/**', 'docs/**', '.github/**', '.gitattributes', '.editorconfig']
  pull_request:
    paths: ['suricata/**', '*.md', 'Dockerfile', '.dockerignore', '.gcloudignore', 'pyproject.toml', 'ruff.toml', 'deploy/**', 'docs/**', '.github/**', '.gitattributes', '.editorconfig']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check --no-input 'ruff==0.16.8'
      - run: ruff check .

  tests:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SURICATA_ENTREGA: desligada
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '22', cache: npm, cache-dependency-path: suricata/whatsapp/package-lock.json}
      - run: python -m pip install --disable-pip-version-check --no-input 'pytest==8.3.5' build
      - run: npm ci --prefix suricata/whatsapp --ignore-scripts --no-audit --no-fund
      - run: python -m pytest -q suricata/tests
      - run: python -m unittest discover -s suricata/tests
      - run: python -m compileall -q suricata
      - run: node --test suricata/tests/*.mjs suricata/whatsapp/tests/*.mjs
      - run: python -m suricata --mode shadow

  build:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build container without publishing
        run: docker build --pull --tag suricata-ci:${{ github.sha }} .
      - name: E2E de imagem (demo offline dentro do container)
        run: docker run --rm suricata-ci:${{ github.sha }} --mode demo
