[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "suricata-whatsapp"
version = "0.1.0"
description = "Runtime público de alertas coletivos da Suricata no WhatsApp"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    # Linux containers usually provide this database through the OS; Windows
    # and minimal Python installations need it explicitly.
    "tzdata>=2024.1",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/zC4sTr0/suricata-whatsapp"

[tool.setuptools.packages.find]
include = ["suricata", "suricata.*"]
namespaces = true

[tool.setuptools.package-data]
"suricata.whatsapp" = ["*.mjs", "package.json", "package-lock.json"]
"suricata.tests.fixtures" = ["*.mjs", "*.json"]

[project.scripts]
suricata = "suricata.entrypoint:main"

[tool.pytest.ini_options]
testpaths = ["suricata/tests"]
python_files = ["test_*.py"]
