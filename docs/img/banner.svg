<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="PUC Bot da Suricata">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="878" height="198" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="1.5"/>
  <rect x="1" y="160" width="878" height="39" rx="14" fill="#0b1220" opacity="0.55"/>
  <rect x="56" y="150" width="120" height="4" rx="2" fill="url(#accent)"/>

  <!-- marca: bolha de chat com alerta (a "suricata" avisando a turma) -->
  <g transform="translate(64,52)">
    <rect x="0" y="0" width="96" height="88" rx="22" fill="url(#accent)" opacity="0.16"/>
    <rect x="0" y="0" width="96" height="88" rx="22" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <path d="M20 88 L20 108 L44 88 Z" fill="#22d3ee" opacity="0.8"/>
    <path d="M48 22 L48 52 M48 62 L48 66" stroke="#e2e8f0" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- wordmark -->
  <text x="196" y="98" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#f1f5f9">PUC Bot</text>
  <text x="200" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="19" fill="#94a3b8">da Suricata · avisos acadêmicos no WhatsApp</text>

  <!-- pills -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="596" y="46" width="76" height="26" rx="13" fill="none" stroke="#34d399" stroke-width="1.4"/>
    <text x="634" y="63" fill="#34d399" text-anchor="middle">Python</text>
    <rect x="680" y="46" width="66" height="26" rx="13" fill="none" stroke="#fbbf24" stroke-width="1.4"/>
    <text x="713" y="63" fill="#fbbf24" text-anchor="middle">Node</text>
    <rect x="754" y="46" width="68" height="26" rx="13" fill="none" stroke="#a78bfa" stroke-width="1.4"/>
    <text x="788" y="63" fill="#a78bfa" text-anchor="middle">GCP</text>
    <rect x="596" y="80" width="118" height="26" rx="13" fill="none" stroke="#22d3ee" stroke-width="1.4"/>
    <text x="655" y="97" fill="#22d3ee" text-anchor="middle">stdlib pura</text>
    <rect x="722" y="80" width="100" height="26" rx="13" fill="none" stroke="#fb7185" stroke-width="1.4"/>
    <text x="772" y="97" fill="#fb7185" text-anchor="middle">fail-closed</text>
  </g>
</svg>
